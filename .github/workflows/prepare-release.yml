name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version to release (1.2.3), overriding the bump
        type: string
        default: ""

permissions:
  contents: read

jobs:
  tag:
    name: Tag the release
    if: github.repository == 'quotaline/quotaline'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.next }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Work out the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          if [ -n "$EXPLICIT" ]; then
            next="${EXPLICIT#v}"
          else
            current=$(git tag --list 'v*' --sort=-v:refname | head -1)
            if [ -z "$current" ]; then
              current=$(sed -n 's/^  version "\([^"]*\)"/\1/p' Casks/quotaline.rb)
            fi
            current="${current#v}"
            current="${current:-0.0.0}"
            IFS='.' read -r major minor patch <<< "$current"
            case "$BUMP" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              patch) next="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          source_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' gnome/Cargo.toml | head -1)
          if [ "$next" != "$source_version" ]; then
            echo "::error::Tag v$next requires GNOME package version $next; source has $source_version"
            exit 1
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Releasing $next"
      - name: Push the tag
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          if git rev-parse "v$NEXT" >/dev/null 2>&1; then
            echo "::error::v$NEXT already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$NEXT" -m "Release $NEXT"
          git push origin "v$NEXT"
      - name: Say what happens next
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          echo "Tagged v$NEXT. Release builds GNOME and macOS downloads, the cask and the App Store upload." \
            >> "$GITHUB_STEP_SUMMARY"

  # A tag pushed with GITHUB_TOKEN starts no workflow of its own, so this dispatches the release instead. Calling it as a
  # reusable workflow would leave its jobs without the `release` environment's secrets; a dispatched run reads them.
  release:
    name: Start the release
    needs: tag
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: v${{ needs.tag.outputs.version }}
        run: gh workflow run release.yml --repo "$REPOSITORY" --ref "$TAG" --field tag="$TAG"

name: Prepare Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options: [auto, major, minor, patch]
        default: auto
permissions: {}
concurrency:
  group: prepare-release
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'quotaline/quotaline' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: --locked
          cache: false
      - name: Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@33db207c963ad07b8d2bff4099143593fd4100b2
        with:
          venv: ${{ runner.temp }}/release-tools
      - name: Add release tools to PATH
        run: echo "$RUNNER_TEMP/release-tools/bin" >> "$GITHUB_PATH"
      - name: Select version from fragments
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [[ -n $(git tag --list 'v*') ]]; then
            version=$(git tag --list | release-creator tags --next "$BUMP" --prefix v)
          else
            previous=$(awk '$1 == "##" { print "v" $2; exit }' website/content/changelog/_index.md)
            test -n "$previous"
            version=$(printf '%s\n' "$previous" | release-creator tags --next "$BUMP" --prefix v)
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Match source version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - << 'PY'
          import os
          import tomllib
          from pathlib import Path

          expected = os.environ["VERSION"].removeprefix("v")
          for manifest in Path.cwd().rglob("Cargo.toml"):
              if "target" in manifest.parts:
                  continue
              actual = tomllib.loads(manifest.read_text()).get("package", {}).get("version")
              if actual is not None and actual != expected:
                  raise SystemExit(f"::error::{manifest} has version {actual}; expected {expected}")
          project = Path("macos/App/project.yml").read_text().splitlines()
          for field in ("MARKETING_VERSION", "SOURCE_VERSION"):
              if f'    {field}: "{expected}"' not in project:
                  raise SystemExit(f"::error::macos/App/project.yml needs {field}: {expected}")
          PY
      - id: prepare
        uses: tox-dev/github-workflows/prepare-towncrier@33db207c963ad07b8d2bff4099143593fd4100b2
        env:
          SKIP: swift-format,swiftlint
        with:
          version: ${{ steps.version.outputs.version }}
          changelog: website/content/changelog/_index.md
          fragments: changelog.d
          format: markdown
          numbered-prs: "true"
          patch: ${{ runner.temp }}/release.patch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-patch
          path: ${{ runner.temp }}/release.patch
          if-no-files-found: error
  validate:
    needs: assemble
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      patch-sha: ${{ steps.digest.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-patch
          path: ${{ runner.temp }}/release-patch
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: --locked
          cache: false
      - name: Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@33db207c963ad07b8d2bff4099143593fd4100b2
        with:
          venv: ${{ runner.temp }}/release-tools
      - name: Add release tools to PATH
        run: echo "$RUNNER_TEMP/release-tools/bin" >> "$GITHUB_PATH"
      - uses: tox-dev/github-workflows/validate-release-patch@33db207c963ad07b8d2bff4099143593fd4100b2
        env:
          SKIP: swift-format,swiftlint
        with:
          version: ${{ needs.assemble.outputs.version }}
          changelog: website/content/changelog/_index.md
          fragments: changelog.d
          patch: ${{ runner.temp }}/release-patch/release.patch
          expected-sha: ${{ github.sha }}
      - name: Record validated patch digest
        id: digest
        run: |
          read -r patch_sha _ < <(sha256sum "$RUNNER_TEMP/release-patch/release.patch")
          echo "sha=$patch_sha" >> "$GITHUB_OUTPUT"
  push:
    needs: [assemble, validate]
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    environment: release-auth
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-patch
          path: ${{ runner.temp }}/release-patch
      - uses: tox-dev/github-workflows/validate-release-patch@33db207c963ad07b8d2bff4099143593fd4100b2
        with:
          version: ${{ needs.assemble.outputs.version }}
          changelog: website/content/changelog/_index.md
          fragments: changelog.d
          patch: ${{ runner.temp }}/release-patch/release.patch
          expected-sha: ${{ github.sha }}
          expected-patch-sha: ${{ needs.validate.outputs.patch-sha }}
          checks: "false"
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Set App commit identity
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          app_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
      - name: Commit release changelog
        env:
          VERSION: ${{ needs.assemble.outputs.version }}
        run: git commit -m "Prepare $VERSION"
      - name: Push release commit
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh auth setup-git --hostname github.com --force
          git push origin HEAD:main
      - name: Run full CI on release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
      - name: Require full CI on release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          for ((attempt = 0; attempt < 24; attempt++)); do
            run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$sha" -f event=workflow_dispatch -f per_page=10 --jq '.workflow_runs[0].id // empty')
            if [[ -n "$run_id" ]]; then
              gh run watch "$run_id" --exit-status
              exit 0
            fi
            sleep 5
          done
          echo "::error::full CI run did not appear for $sha"
          exit 1
      - name: Verify release branch did not move
        run: |
          git fetch origin main
          if [[ $(git rev-parse origin/main) != "$(git rev-parse HEAD)" ]]; then
            echo '::error::main moved after release CI'
            exit 1
          fi
      - name: Create annotated tag
        env:
          VERSION: ${{ needs.assemble.outputs.version }}
        run: git tag -a "$VERSION" -m "Release $VERSION"
      - name: Push release tag
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ needs.assemble.outputs.version }}
        run: git push origin "refs/tags/$VERSION"

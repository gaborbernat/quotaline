name: Recheck hook cooldown
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions: {}
jobs:
  recheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/recheck-hook-update-cooldown@cadf58a0dcc5d0c7853b248ab7c2b19bb93675d1
        with:
          workflow: ci.yml
          job-name: Hook update cooldown

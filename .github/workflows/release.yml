name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (v1.2.3)
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  preflight:
    name: Which legs can run
    # Only this repository holds the signing identities; a fork that runs the workflow gets nothing to leak.
    if: github.repository == 'quotaline/quotaline'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    # The signing secrets live in this environment, so every job that touches them names it and inherits its
    # protection rules.
    environment: release
    outputs:
      app_store: ${{ steps.check.outputs.app_store }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Match the release tag to the package version
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' gnome/Cargo.toml | head -1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match GNOME package version $version"
            exit 1
          fi
      # A job cannot read secrets in its own `if`, so the release works out here which legs it can publish.
      # A tag that reaches only two of the three channels is a half-published release, so a missing credential stops
      # the run here rather than leaving the App Store behind without anyone noticing.
      - name: Require the App Store credentials
        id: check
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_BASE64 }}
          MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_STORE_WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          missing=""
          for name in APPLE_DISTRIBUTION_CERTIFICATE_BASE64 APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD \
            MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_BASE64 MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_PASSWORD \
            APP_STORE_PROVISIONING_PROFILE_BASE64 APP_STORE_WIDGET_PROVISIONING_PROFILE_BASE64; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Cannot upload to the App Store without:$missing"
            exit 1
          fi
          echo "app_store=true" >> "$GITHUB_OUTPUT"
      # Continuous integration already ran the application tests against this commit, on every runtime rather than the
      # two a release once repeated, so the release reads that verdict instead of spending another forty minutes to
      # cover less.
      - name: Require a green commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: macos/Scripts/check-commit-verdict.sh "$TAG"

  gnome:
    name: GNOME download
    needs: preflight
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Install extension packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gnome-shell unzip
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: --locked
          cache: false
      - run: mise exec -- just release-package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gnome-download
          path: |
            target/quotaline-gnome-linux-x86_64.tar.gz
            target/quotaline-gnome-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  direct:
    name: Direct and Homebrew downloads
    needs: [preflight, gnome]
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    defaults:
      run:
        working-directory: macos
    # This job publishes the release; the cask job opens its branch from a clean main checkout.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: --locked
          working_directory: macos
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gnome-download
          path: macos/dist/gnome
      - name: Use the runner temp directory
        run: |
          mkdir -p "$RUNNER_TEMP/quotaline"
          echo "TMPDIR=$RUNNER_TEMP/quotaline" >> "$GITHUB_ENV"
      - name: Select Xcode
        run: Scripts/select-xcode.sh
      - name: Build Rust bridge
        run: mise exec -- just macos-bindings
      - name: Stamp version
        run: just macos-stamp "${TAG#v}"
      - name: Verify the release build number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(just macos-version --build)"
          published_tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if [ -n "$published_tag" ]; then
            appcast="$RUNNER_TEMP/published-appcast.xml"
            gh release download "$published_tag" --pattern appcast.xml --output "$appcast"
            # The element name carries a colon, so the substitution needs a delimiter the markup cannot contain.
            published="$(sed -n 's|.*<sparkle:version>\([0-9][0-9]*\)</sparkle:version>.*|\1|p' "$appcast" | head -1)"
            [[ "$current" =~ ^[0-9]+$ && "$published" =~ ^[0-9]+$ ]] || {
              echo "::error::Could not read numeric build numbers from git and $published_tag"
              exit 1
            }
            if [ "$published_tag" = "$TAG" ]; then
              ((current == published)) || {
                echo "::error::$TAG was published with build $published, but this checkout produces $current"
                exit 1
              }
            elif ((current <= published)); then
              echo "::error::Build $current must be greater than $published from $published_tag"
              exit 1
            fi
          fi
      - name: Require release credentials
        # A tag must never publish an app Gatekeeper rejects or a feed Sparkle cannot verify, so the job stops here
        # rather than falling back to an ad-hoc build. Use the ad-hoc workflow_dispatch build for unsigned testing.
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          missing=""
          for name in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD TEAM_ID APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_BASE64 SPARKLE_PUBLIC_ED_KEY SPARKLE_PRIVATE_ED_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Cannot publish a release without:$missing"
            exit 1
          fi
      - name: Import Developer ID certificate
        id: identity
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          Scripts/import-certificate.sh
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Generate project
        run: cd App && xcodegen generate
      - name: Archive and export
        env:
          SIGNED: ${{ steps.identity.outputs.signed }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: just macos-build-direct
      - name: Archive and export Homebrew
        env:
          SIGNED: ${{ steps.identity.outputs.signed }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: just macos-build-homebrew
      - name: Notarize and staple applications
        if: steps.identity.outputs.signed == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          Scripts/notarize.sh "dist/direct/Quotaline.app" "dist/homebrew/Quotaline.app"
      - name: Package downloads
        run: |
          Scripts/package-direct.sh "${TAG#v}"
          just macos-package-homebrew "${TAG#v}"
      - name: Notarize and staple disk images
        if: steps.identity.outputs.signed == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          Scripts/notarize.sh dist/direct/Quotaline.dmg dist/homebrew/Quotaline-Homebrew.dmg
      - name: Refresh checksums
        shell: bash
        run: |
          for file in dist/direct/Quotaline.zip dist/direct/Quotaline.dmg \
            dist/homebrew/Quotaline-Homebrew.zip dist/homebrew/Quotaline-Homebrew.dmg; do
            shasum -a 256 "$file" | awk '{print $1}' > "$file.sha256"
          done
      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: Scripts/appcast.sh "${TAG#v}"
      - name: Update Homebrew cask file
        run: Scripts/update-cask.sh "${TAG#v}" dist/homebrew/Quotaline-Homebrew.dmg
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downloads
          path: |
            macos/dist/direct/*.zip
            macos/dist/direct/*.dmg
            macos/dist/direct/*.sha256
            macos/dist/direct/appcast.xml
            macos/dist/homebrew/*.zip
            macos/dist/homebrew/*.dmg
            macos/dist/homebrew/*.sha256
            macos/dist/gnome/*.tar.gz
            macos/dist/gnome/*.sha256
            Casks/quotaline.rb
      - name: Publish GitHub release
        # the action uploads the assets and writes the notes in one step
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3 # zizmor: ignore[superfluous-actions]
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            macos/dist/direct/Quotaline.zip
            macos/dist/direct/Quotaline.dmg
            macos/dist/direct/Quotaline.zip.sha256
            macos/dist/direct/Quotaline.dmg.sha256
            macos/dist/direct/appcast.xml
            macos/dist/homebrew/Quotaline-Homebrew.zip
            macos/dist/homebrew/Quotaline-Homebrew.dmg
            macos/dist/homebrew/Quotaline-Homebrew.zip.sha256
            macos/dist/homebrew/Quotaline-Homebrew.dmg.sha256
            macos/dist/gnome/quotaline-gnome-linux-x86_64.tar.gz
            macos/dist/gnome/quotaline-gnome-linux-x86_64.tar.gz.sha256
            Casks/quotaline.rb
      - name: Verify the Homebrew asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fx 'Quotaline-Homebrew.dmg'
  cask:
    name: Open the Homebrew cask update
    needs: direct
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: downloads
          path: release
      - name: Open a cask pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.TAG }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          branch="automation/cask-${TAG#v}"
          cp release/Casks/quotaline.rb Casks/quotaline.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- Casks/quotaline.rb; then
            git add Casks/quotaline.rb
            git commit -m "Update Homebrew cask for ${TAG}"
            remote_sha="$(git ls-remote --heads "$remote" "refs/heads/$branch" | awk '{print $1}')"
            if [ -n "$remote_sha" ]; then
              git push --force-with-lease="refs/heads/$branch:$remote_sha" "$remote" "HEAD:refs/heads/$branch"
            else
              git push "$remote" "HEAD:refs/heads/$branch"
            fi
            if ! gh pr list --head "$branch" --state open --json number --jq 'length > 0' | grep -Fx true; then
              gh pr create --base main --head "$branch" --title "Update Homebrew cask for ${TAG}" \
                --body "Publish the ${TAG} Homebrew package checksum."
            fi
          fi

  app-store:
    name: Mac App Store upload
    needs: [preflight, direct]
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    defaults:
      run:
        working-directory: macos
    permissions:
      contents: read
    if: needs.preflight.outputs.app_store == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.11
          install_args: --locked
          working_directory: macos
          cache: false
      - name: Use the runner temp directory
        run: |
          mkdir -p "$RUNNER_TEMP/quotaline"
          echo "TMPDIR=$RUNNER_TEMP/quotaline" >> "$GITHUB_ENV"
      - name: Select Xcode
        run: Scripts/select-xcode.sh
      - name: Build Rust bridge
        run: mise exec -- just macos-bindings
      - name: Stamp version
        run: just macos-stamp "${TAG#v}"
      - name: Import App Store certificates
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_BASE64 }}
          INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: Scripts/import-certificate.sh
      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_STORE_WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          profiles=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$profiles"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profiles/quotaline.provisionprofile"
          echo "$WIDGET_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$profiles/quotaline-widget.provisionprofile"
      - name: Generate project
        run: cd App && xcodegen generate
      - name: Archive, export and upload
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: just macos-build-app-store

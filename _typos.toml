[default]
# Git revisions and Xcode object IDs are hexadecimal identifiers.
extend-ignore-re = ["\\b[0-9a-fA-F]{7,40}\\b"]

[default.extend-identifiers]
numer = "numer" # Mach timebase field.
_PAETH = "_PAETH" # PNG filter named after Alan Paeth.
CPY001 = "CPY001" # Ruff rule identifier.
OND = "OND" # On-demand quota label.

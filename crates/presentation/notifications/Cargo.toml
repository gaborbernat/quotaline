[package]
name = "quotaline-notifications"
version = "0.1.8"
edition = "2024"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
quotaline-catalog = { version = "0.1.8", path = "../../catalog" }
quotaline-quota = { version = "0.1.8", path = "../quota" }
quotaline-settings = { version = "0.1.8", path = "../../settings" }
quotaline-text = { version = "0.1.8", path = "../text" }

[dev-dependencies]
quotaline-text = { version = "0.1.8", path = "../text", features = ["test-support"] }

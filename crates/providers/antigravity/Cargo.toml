[package]
name = "quotaline-antigravity"
version = "0.1.8"
edition = "2024"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde_json = "1"
sha2 = "0.11"
quotaline-http = { version = "0.1.8", path = "../../http" }
quotaline-quota = { version = "0.1.8", path = "../../presentation/quota" }
quotaline-text = { version = "0.1.8", path = "../../presentation/text" }

[dev-dependencies]
futures-executor = "0.3"
quotaline-http = { version = "0.1.8", path = "../../http", features = ["test-support"] }

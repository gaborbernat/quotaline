<header class="masthead">
  <div class="wrap">
    <a class="brand" href="{{ .Site.Home.RelPermalink }}">
      <img src="{{ "brand/mark.svg" | relURL }}" alt="" width="28" height="28">
      <span>{{ .Site.Title }}</span>
    </a>
    <nav class="nav" aria-label="Main">
      {{- $current := .RelPermalink -}}
      {{ range .Site.Menus.main }}
        {{- $url := .URL | relLangURL -}}
        {{- $on := eq $current $url }}
        <a href="{{ $url }}"{{ if $on }} aria-current="page"{{ end }}>
          {{ .Name }}</a>
      {{ end }}
      <a href="{{ .Site.Params.repository }}">GitHub</a>
    </nav>
    {{/* Outside the nav: switches are not navigation, and on a phone the links scroll under toggles that
         stay put. */}}
    <div class="platform-toggle" role="group" aria-label="Desktop">
      <button type="button" data-platform="macos" aria-pressed="true">macOS</button>
      <button type="button" data-platform="gnome" aria-pressed="false">GNOME</button>
    </div>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Dark theme" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        aria-hidden="true">
        <path id="theme-icon" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
      </svg>
    </button>
  </div>
</header>

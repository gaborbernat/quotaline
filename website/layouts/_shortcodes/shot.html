{{- $name := .Get "name" -}}
{{- $gnome := .Get "gnome" -}}
{{- $alt := .Get "alt" | default "" -}}
{{- $scale := int (.Get "scale" | default 2) -}}
<div class="shot-compare">
  {{- with $name -}}
    <figure class="shot-figure">
      {{- range $variant := (slice "light" "dark") -}}
        {{- with resources.Get (printf "images/%s-%s.webp" $name $variant) -}}
          {{- partial "shot-image.html" (dict
                "image" . "scale" $scale "alt" $alt "loading" "lazy"
                "class" (printf "shot only-%s" $variant)) -}}
        {{- else -}}
          {{- errorf "Missing screenshot images/%s-%s.webp" $name $variant -}}
        {{- end -}}
      {{- end -}}
      {{- with $.Get "caption" }}<figcaption>{{ if $gnome }}<strong>macOS</strong> · {{ end }}{{ . }}</figcaption>{{ end -}}
    </figure>
  {{- end -}}
  {{- with $gnome -}}
    <figure class="shot-figure">
      {{- with resources.Get (printf "images/%s.webp" .) -}}
        {{- partial "shot-image.html" (dict
              "image" . "scale" ($.Get "gnome-scale" | default 1 | int) "alt" ($.Get "gnome-alt" | default $alt)
              "loading" "lazy" "class" "shot") -}}
      {{- else -}}
        {{- errorf "Missing screenshot images/%s.webp" $gnome -}}
      {{- end -}}
      {{- with $.Get "gnome-caption" }}<figcaption>{{ if $name }}<strong>GNOME</strong> · {{ end }}{{ . }}</figcaption>{{ end -}}
    </figure>
  {{- end -}}
</div>
